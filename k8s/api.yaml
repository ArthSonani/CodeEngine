apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine-api
  template:
    metadata:
      labels:
        app: engine-api
    spec:
      containers:
      - name: api
        image: engine-api:latest
        imagePullPolicy: Never
        env:
          - name: KAFKA_BROKER
            value: kafka.default.svc.cluster.local:9092
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: engine-api
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  selector:
    app: engine-api
